<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S.R Standards</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="./taskpane.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Calibri, Arial, sans-serif;
      font-size: 11pt;
      background: #ffffff;
      color: #222222;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 16pt;
    }

    .hint {
      margin-bottom: 16px;
      color: #666666;
      line-height: 1.4;
    }

    .section-title {
      margin: 18px 0 8px 0;
      font-weight: bold;
      font-size: 11pt;
    }

    .option-box {
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .radio-row,
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .radio-row:last-child,
    .checkbox-row:last-child {
      margin-bottom: 0;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-top: 2px;
      flex: 0 0 auto;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-family: Calibri, Arial, sans-serif;
      font-size: 11pt;
    }

    label {
      line-height: 1.35;
      cursor: pointer;
    }

    .sub-input {
      margin: 4px 0 10px 26px;
    }

    .actions {
      margin-top: 16px;
    }

    button {
      width: 100%;
      display: block;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
      text-align: left;
      font-size: 11pt;
      font-family: Calibri, Arial, sans-serif;
    }

    button:hover {
      background: #eeeeee;
    }

    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f3f3f3;
      color: #444444;
      min-height: 20px;
      font-size: 11pt;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>S.R Standards</h2>

  <div class="hint">
    Bitte Vorgang und zutreffende Punkte auswählen. Der Text wird in die aktuell geöffnete E-Mail eingefügt.
  </div>

  <div class="section-title">Vorgang</div>
  <div class="option-box">
    <div class="radio-row">
      <input type="radio" id="typeRechnung" name="mailType" value="rechnung" checked>
      <label for="typeRechnung">Gewerkerechnung</label>
    </div>
    <div class="radio-row">
      <input type="radio" id="typeNachtrag" name="mailType" value="nachtrag">
      <label for="typeNachtrag">Gewerkenachtrag</label>
    </div>
  </div>

  <div class="section-title">Betreff</div>
  <div class="option-box">
    <div class="checkbox-row">
      <input type="checkbox" id="useSubject">
      <label for="useSubject">Betreff automatisch setzen</label>
    </div>

    <div class="checkbox-row">
      <input type="text" id="proj" placeholder="Projektkürzel">
    </div>

    <div class="checkbox-row">
      <input type="text" id="verg" placeholder="Vergabenummer">
    </div>

    <div class="checkbox-row">
      <input type="text" id="auftr" placeholder="Auftragnehmer">
    </div>

    <div class="checkbox-row">
      <input type="text" id="subjLast" placeholder="Freier letzter Betreffteil">
    </div>
  </div>

  <div id="rechnungSection">
    <div class="section-title">Prüfpunkte – Gewerkerechnung</div>
    <div class="option-box">
      <div class="checkbox-row">
        <input type="checkbox" id="r1">
        <label for="r1">Vollständigkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r1_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r2">
        <label for="r2">Nachvollziehbarkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r2_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r3">
        <label for="r3">Übereinstimmung der Einheitspreise mit LV / Auftrag</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r3_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r4">
        <label for="r4">Rechnungspositionen ohne Auftrag</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r4_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r5">
        <label for="r5">Rechnerische Richtigkeit / korrekte Übertragung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r5_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r6">
        <label for="r6">Einhaltung der Auftragssumme</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r6_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="r7">
        <label for="r7">Vollständigkeit / Richtigkeit formaler Angaben (z. B. Stempel)</label>
      </div>
      <div class="sub-input">
        <input type="text" id="r7_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>
    </div>
  </div>

  <div id="nachtragSection" class="hidden">
    <div class="section-title">Prüfpunkte – Gewerkenachtrag</div>
    <div class="option-box">
      <div class="checkbox-row">
        <input type="checkbox" id="n1">
        <label for="n1">Vollständigkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n1_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n2">
        <label for="n2">Nachvollziehbarkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n2_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n3">
        <label for="n3">Übereinstimmung der Einheitspreise mit vertraglichen Vereinbarungen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n3_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n4">
        <label for="n4">Angemessenheit der Preisansätze</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n4_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n5">
        <label for="n5">Nachvollziehbarkeit der Nachtragsbegründung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n5_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n6">
        <label for="n6">Leistungen bereits vom bestehenden Auftrag umfasst</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n6_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n7">
        <label for="n7">Herleitung und Nachvollziehbarkeit der Mengenansätze</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n7_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n8">
        <label for="n8">Rechnerische Richtigkeit / korrekte Übertragung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n8_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="n9">
        <label for="n9">Vollständigkeit / Richtigkeit formaler Angaben (z. B. Stempel)</label>
      </div>
      <div class="sub-input">
        <input type="text" id="n9_note" placeholder="Ergebnis der Stichprobe(n)">
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="btnInsert" type="button">Text einfügen</button>
  </div>

  <div id="status" class="status">Bereit.</div>
</body>
</html>
