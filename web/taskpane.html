<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SR Standards</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="./taskpane.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #222222;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
    }

    .section {
      margin-bottom: 16px;
    }

    .hint {
      margin-bottom: 16px;
      color: #666666;
      line-height: 1.4;
    }

    button {
      width: 100%;
      display: block;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }

    button:hover {
      background: #eeeeee;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f3f3f3;
      color: #444444;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h2>SR Standards</h2>

  <div class="hint">
    Standardtext auswählen. Der Text wird oben in die aktuelle E-Mail eingefügt.
  </div>

  <div class="section">
    <button id="btnStatusbericht" type="button">Statusbericht</button>
    <button id="btnProtokoll" type="button">Protokollversand</button>
    <button id="btnTermin" type="button">Terminbestätigung</button>
  </div>

  <div id="status" class="status">Bereit.</div>
</body>
</html>
