<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S.R Standards</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="./taskpane.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Calibri, Arial, sans-serif;
      font-size: 11pt;
      background: #ffffff;
      color: #222222;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 16pt;
    }

    .hint {
      margin-bottom: 16px;
      color: #666666;
      line-height: 1.4;
    }

    .section-title {
      margin: 18px 0 8px 0;
      font-weight: bold;
      font-size: 11pt;
    }

    .subsection-title {
      margin: 14px 0 8px 0;
      font-weight: bold;
      font-size: 11pt;
      color: #444444;
    }

    .option-box {
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .radio-row,
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .radio-row:last-child,
    .checkbox-row:last-child {
      margin-bottom: 0;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-top: 2px;
      flex: 0 0 auto;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-family: Calibri, Arial, sans-serif;
      font-size: 11pt;
    }

    label {
      line-height: 1.35;
      cursor: pointer;
    }

    .sub-input {
      margin: 4px 0 10px 26px;
    }

    .actions {
      margin-top: 16px;
    }

    button {
      width: 100%;
      display: block;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
      text-align: left;
      font-size: 11pt;
      font-family: Calibri, Arial, sans-serif;
    }

    button:hover {
      background: #eeeeee;
    }

    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f3f3f3;
      color: #444444;
      min-height: 20px;
      font-size: 11pt;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>S.R Standards</h2>

  <div class="hint">
    Bitte Vorgang und zutreffende Punkte auswählen. Der Text wird in die aktuell geöffnete E-Mail eingefügt.
  </div>

  <div class="section-title">Vorgang</div>
  <div class="option-box">
    <div class="radio-row">
      <input type="radio" id="typeRechnung" name="mailType" value="rechnung" checked>
      <label for="typeRechnung">Gewerkerechnung</label>
    </div>
    <div class="radio-row">
      <input type="radio" id="typeNachtrag" name="mailType" value="nachtrag">
      <label for="typeNachtrag">Gewerkenachtrag</label>
    </div>
  </div>

  <div class="section-title">Betreff</div>
  <div class="option-box">
    <div class="checkbox-row">
      <input type="checkbox" id="useSubject">
      <label for="useSubject">Betreff automatisch setzen</label>
    </div>

    <div class="checkbox-row">
      <input type="text" id="proj" placeholder="Projektkürzel">
    </div>

    <div class="checkbox-row">
      <input type="text" id="verg" placeholder="Vergabenummer">
    </div>

    <div class="checkbox-row">
      <input type="text" id="auftr" placeholder="Auftragnehmer">
    </div>

    <div class="checkbox-row">
      <input type="text" id="subjLast" placeholder="Freier letzter Betreffteil">
    </div>
  </div>

  <div id="rechnungSection">
    <div class="section-title">Prüfpunkte – Gewerkerechnung</div>
    <div class="option-box">

      <div class="subsection-title">Formale Aspekte</div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf1">
        <label for="rf1">das Vorhandensein des Prüfblattes zur Rechnungsprüfung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf1_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf2">
        <label for="rf2">die kumulierte Darstellung der Rechnung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf2_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf3">
        <label for="rf3">die korrekte Angabe des Leistungszeitraums</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf3_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf4">
        <label for="rf4">die Vollständigkeit und Richtigkeit der Prüfstempel</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf4_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf5">
        <label for="rf5">die korrekte Darstellung der bereits geleisteten Zahlungen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf5_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf6">
        <label for="rf6">die Einhaltung der vereinbarten Auftragssumme</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf6_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="rf7">
        <label for="rf7">die Vollständigkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="rf7_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="subsection-title">Inhaltliche Aspekte</div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri1">
        <label for="ri1">die Vollständigkeit und Richtigkeit des Prüfblattes zur Rechnungsprüfung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri1_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri2">
        <label for="ri2">die Einhaltung vertraglicher Rahmenbedingungen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri2_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri3">
        <label for="ri3">die Übereinstimmung der abgerechneten Einheitspreise mit dem Leistungsverzeichnis / Auftrag</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri3_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri4">
        <label for="ri4">die Abweichungen der abgerechneten Mengen (+/- 10 %) im Vergleich zum vereinbarten Leistungsumfang</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri4_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri5">
        <label for="ri5">die rechnerische Richtigkeit sowie die korrekte Übertragung der Werte</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri5_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ri6">
        <label for="ri6">die Nachvollziehbarkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ri6_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>
    </div>
  </div>

  <div id="nachtragSection" class="hidden">
    <div class="section-title">Prüfpunkte – Gewerkenachtrag</div>
    <div class="option-box">

      <div class="subsection-title">Formale Aspekte</div>

      <div class="checkbox-row">
        <input type="checkbox" id="nf1">
        <label for="nf1">das Vorhandensein des Prüfblattes zur Nachtragsprüfung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="nf1_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="nf2">
        <label for="nf2">die Vollständigkeit und Richtigkeit der Prüfstempel</label>
      </div>
      <div class="sub-input">
        <input type="text" id="nf2_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="nf3">
        <label for="nf3">die Vollständigkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="nf3_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="subsection-title">Inhaltliche Aspekte</div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni1">
        <label for="ni1">die Vollständigkeit und Richtigkeit des Prüfblattes zur Nachtragsprüfung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni1_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni2">
        <label for="ni2">die Nachvollziehbarkeit der Nachtragsbegründung</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni2_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni3">
        <label for="ni3">die Leistungen, die bereits vom bestehenden Auftrag umfasst sind</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni3_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni4">
        <label for="ni4">die Übereinstimmung der angesetzten Einheitspreise mit den vertraglichen Vereinbarungen bei Mehrmengen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni4_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni5">
        <label for="ni5">die Angemessenheit der Preisansätze</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni5_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni6">
        <label for="ni6">die Herleitung und Nachvollziehbarkeit der Mengenansätze</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni6_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni7">
        <label for="ni7">die rechnerische Richtigkeit sowie die korrekte Übertragung der Werte</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni7_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ni8">
        <label for="ni8">die Nachvollziehbarkeit der Nachweise / Anlagen</label>
      </div>
      <div class="sub-input">
        <input type="text" id="ni8_note" placeholder="Hinweis aus Stichprobe(n)">
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="btnInsert" type="button">Text einfügen</button>
  </div>

  <div id="status" class="status">Bereit.</div>
</body>
</html>
